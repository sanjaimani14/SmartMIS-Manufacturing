id: weekly_machine_shop
title: Weekly Machine Shop Performance & Rejection Report
department: Machine Shop
period_type: weekly
period_days: 7
target_rejection: 4.0
signoff:
  prepared_by: Machining Quality Engineer
  reviewed_by: Machine Shop Operations Head

kpis:
  - id: Produced
    label: Total Machined Output
  - id: Good
    label: Conforming Components
  - id: Rejected
    label: Total Non-Conformance
  - id: "Rejection %"
    label: Rejection Rate (%)
  - id: Scrap
    label: Scrapped Components
  - id: Rework
    label: Rectified via Rework
  - id: "Plan Adherence %"
    label: Schedule Adherence (%)
  - id: "Total Downtime (hrs)"
    label: CNC/VMC Stoppage Time

sections:
  - id: daily_trend
    name: Daily Trend
    groupby: [date]
    metrics: [produced, rejected, rejection_%, scrap, rework]
    sort_by: date
    sort_ascending: true
  - id: by_machine
    name: By Machine
    groupby: [machine]
    metrics: [produced, rejected, rejection_%, scrap, rework]
    sort_by: rejection_%
    sort_ascending: false
  - id: by_product
    name: By Product
    groupby: [product]
    metrics: [produced, rejected, rejection_%, scrap, rework]
    sort_by: rejection_%
    sort_ascending: false
  - id: by_shift
    name: By Shift
    groupby: [shift]
    metrics: [produced, rejected, rejection_%]
    sort_by: shift
    sort_ascending: true

charts:
  - section: daily_trend
    title: Machine Shop Daily Rejection Trend
    type: line
    x: date
    y: rejection_%
    target_line: true
  - section: by_machine
    title: Machine-wise Rejection Comparison
    type: bar
    x: machine
    y: rejection_%
  - section: by_product
    title: Component Rejection Rates
    type: bar
    x: product
    y: rejection_%
